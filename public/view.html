<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Artikel</title>
    <style>
        body { font-family: Georgia, serif; max-width: 700px; margin: 40px auto; padding: 20px; line-height: 1.7; color: #222; }
        h1 { font-family: sans-serif; font-size: 2.5rem; margin-bottom: 10px; }
        .meta { color: #666; font-family: sans-serif; margin-bottom: 30px; font-size: 0.9rem; }
        .content { font-size: 1.2rem; white-space: pre-wrap; }
    </style>
</head>
<body>
    <div id="root">Loading...</div>

    <script>
        const id = window.location.pathname.split('/').pop();
        async function load() {
            const res = await fetch(`/api/post/${id}`);
            if (!res.ok) {
                document.getElementById('root').innerHTML = "<h1>404</h1><p>Artikel tidak ditemukan.</p>";
                return;
            }
            const post = await res.json();
            document.title = post.title;
            document.getElementById('root').innerHTML = `
                <h1>${post.title}</h1>
                <div class="meta">Oleh ${post.author} • ${new Date(post.createdAt).toLocaleDateString('id-ID')}</div>
                <div class="content">${post.content}</div>
            `;
        }
        load();
    </script>
</body>
</html>
