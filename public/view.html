<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lenz Uploader</title>
    <style>
        body { font-family: -apple-system, sans-serif; max-width: 700px; margin: 40px auto; padding: 20px; line-height: 1.7; color: #222; }
        h1 { font-size: 2.5rem; margin-bottom: 10px; font-weight: 800; }
        .meta { color: #888; margin-bottom: 30px; font-size: 0.9rem; border-bottom: 1px solid #eee; padding-bottom: 10px; }
        .content { font-size: 1.1rem; white-space: pre-wrap; font-family: Georgia, serif; }
        .post-image { max-width: 100%; border-radius: 10px; margin-bottom: 25px; display: block; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
    </style>
</head>
<body>
    <div id="root"><i>Memuat data...</i></div>

    <script>
        const id = window.location.pathname.split('/').pop();
        async function load() {
            try {
                const res = await fetch(`/api/post/${id}`);
                if (!res.ok) {
                    document.getElementById('root').innerHTML = "<h1>404</h1><p>Halaman tidak ditemukan.</p>";
                    return;
                }
                const post = await res.json();
                document.title = post.title;

                // Cek apakah postingan memiliki gambar
                let imageElement = '';
                if (post.image) {
                    imageElement = `<img src="${post.image}" class="post-image" alt="Uploaded Image">`;
                }

                // Cek apakah postingan memiliki teks konten
                let contentElement = '';
                if (post.content) {
                    contentElement = `<div class="content">${post.content}</div>`;
                }

                document.getElementById('root').innerHTML = `
                    <h1>${post.title}</h1>
                    <div class="meta">Oleh <strong>${post.author}</strong> • ${new Date(post.createdAt).toLocaleDateString('id-ID')}</div>
                    ${imageElement}
                    ${contentElement}
                `;
            } catch (e) {
                document.getElementById('root').innerHTML = "<p>Gagal memuat halaman.</p>";
            }
        }
        load();
    </script>
</body>
</html>
